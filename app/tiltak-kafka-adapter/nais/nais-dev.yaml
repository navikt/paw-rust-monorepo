apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: paw-arbeidssoekerregisteret-tiltak-kafka-adapter
  namespace: paw
  labels:
    team: paw
spec:
  image: {{ image }}
  port: 8080
  env:
    - name: RUST_BACKTRACE
      value: "1"
    - name: RUST_LOG
      value: "INFO"
    - name: PAW_LOG_LEVEL
      value: "DEBUG"
    - name: PGSSLMODE
      value: "VerifyFull"
    - name: PGSSLROOTCERT
      value: "$(DB_TILTAK_SSLROOTCERT)"
    - name: PGSSLCERT
      value: "$(DB_TILTAK_SSLCERT)"
    - name: PGSSLKEY
      value: "$(DB_TILTAK_SSLKEY)"
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      memory: 32Mi
    requests:
      cpu: 25m
      memory: 32Mi
  startup:
    failureThreshold: 10
    initialDelay: 2
    path: /internal/hasStarted
    periodSeconds: 10
    timeout: 5
  liveness:
    path: /internal/isAlive
    initialDelay: 10
  readiness:
    path: /internal/isReady
    initialDelay: 10
  prometheus:
    enabled: true
    path: /internal/metrics
  observability:
    tracing:
      enabled: true
  kafka:
    pool: nav-dev
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        tier: db-g1-small
        databases:
          - name: tiltak
            envVarPrefix: DB_TILTAK