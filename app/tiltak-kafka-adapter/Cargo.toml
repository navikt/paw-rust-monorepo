[package]
name = "tiltak-kafka-adapter"
version = "0.1.0"
edition.workspace = true

[features]
nais = []

[lib]
name = "tiltak_kafka_adapter"
path = "src/lib.rs"

[dependencies]
errors = { path = "../../domain/errors" }
eksterne_hendelser = { path = "../../domain/eksterne_hendelser" }

paw_rust_base = { path = "../../lib/paw_rust_base", features = ["axum"] }
paw_observability = { path = "../../lib/paw_observability" }
paw_sqlx = { path = "../../lib/paw_sqlx" }
paw_kafka = { path = "../../lib/paw_kafka" }
paw_avro_serde = { path = "../../lib/paw_avro_serde" }
nais_schema_registry = { path = "../../lib/nais_schema_registry" }

sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
prometheus = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
serde-env-field = { workspace = true }
rdkafka = { workspace = true }
schema_registry_converter = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
test_data_generator = { path = "../../test/test_data_generator" }
postgres_testcontainer = { path = "../../test/postgres_testcontainer" }
