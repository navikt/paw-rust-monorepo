apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: arbeidssoekerregisteret-internkontroll
  namespace: paw
  labels:
    team: paw
spec:
  image: {{ image }}
  port: 8080
  ingresses:
    - https://internkontroll-arbeidssoekerregisteret.intern.dev.nav.no
  strategy:
    type: Recreate
  replicas:
    min: 1
    max: 1
  env:
    - name: PGSSLMODE
      value: "VerifyFull"
    - name: PGSSLROOTCERT
      value: "$(NAIS_DATABASE_ARBEIDSSOEKERREGISTERET_INTERNKONTROLL_INTERNKONTROLL_SSLROOTCERT)"
    - name: PGSSLCERT
      value: "$(NAIS_DATABASE_ARBEIDSSOEKERREGISTERET_INTERNKONTROLL_INTERNKONTROLL_SSLCERT)"
    - name: PGSSLKEY
      value: "$(NAIS_DATABASE_ARBEIDSSOEKERREGISTERET_INTERNKONTROLL_INTERNKONTROLL_SSLKEY)"
    - name: PAA_VEGNE_AV_TOPIC
      value: "paw.arbeidssoker-bekreftelse-paavegneav-v1"
  liveness:
    path: /internal/isAlive
    initialDelay: 10
  readiness:
    path: /internal/isReady
    initialDelay: 10
  startup:
    failureThreshold: 10
    initialDelay: 2
    path: /internal/hasStarted
    periodSeconds: 10
    timeout: 5
  prometheus:
    enabled: true
    path: /internal/metrics
  observability:
    tracing:
      enabled: true
  kafka:
    pool: {{ kafka }}
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 512Mi
      cpu: 10m
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        tier: db-custom-1-3840
        databases:
          - name: internkontroll
        highAvailability: false
        pointInTimeRecovery: false
        diskAutoresize: true
        insights:
          enabled: false
