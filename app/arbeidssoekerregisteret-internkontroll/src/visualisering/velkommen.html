<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Internkontroll</title>
    <script src="/stats/static/htmx.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 4rem auto; padding: 0 1rem; color: #23262a; }
        h1 { margin-bottom: 0.5rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #cfd3d8; }
        td:nth-child(n+3), th:nth-child(n+3) { text-align: right; font-variant-numeric: tabular-nums; }
        .faner { display: flex; gap: 0.5rem; margin: 1.5rem 0 0.5rem; }
        .faner button { font: inherit; padding: 0.4rem 0.9rem; border: 1px solid #cfd3d8; border-radius: 4px; background: #fff; cursor: pointer; }
        .faner button:hover { background: #f1f3f5; }
    </style>
</head>
<body>
    <main>
        <h1>Internkontroll</h1>
        <p>Velkommen til internkontroll for arbeidssøkerregisteret.</p>
        <nav class="faner" hx-target="#fane" hx-swap="innerHTML">
            <button hx-get="/stats/fane/oversikt">Oversikt</button>
            <button hx-get="/stats/fane/signaturfeil">Signaturfeil</button>
        </nav>
        <div id="fane" hx-get="/stats/fane/oversikt" hx-trigger="load">
            <p>Laster …</p>
        </div>
    </main>
</body>
</html>
