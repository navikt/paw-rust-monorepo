[package]
name = "pdl_hendelser"
version = "0.1.0"
edition.workspace = true

[features]
leesah = ["dep:avro_types", "dep:paw_avro_serde", "dep:serde_with", "dep:thiserror"]

[dependencies]
avro_types = { path = "../avro_types", optional = true }
paw_avro_serde = { path = "../../lib/paw_avro_serde", optional = true }

serde = { workspace = true, features = ["derive"] }
apache-avro = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
strum = { workspace = true }
serde_with = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
test_data_generator = { path = "../../test/test_data_generator" }
schema_registry_mock = { path = "../../test/schema_registry_mock" }

uuid = { workspace = true, features = ["serde"] }
mockito = { workspace = true }
tokio = { workspace = true }
schema_registry_converter = { workspace = true }
